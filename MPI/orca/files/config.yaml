---
# yamllint disable rule:line-length
format: 1
orca:
  defaults:
    group: MPI
    overlay: base
    relstage: stable

  versions:
    6.1.1:
      variants:
        - group: MPI
          overlay: Alps
          relstage: unstable
          target_cpus: [x86_64]
          systems: [login.*.merlin7.psi.ch, cn.*.merlin7.psi.ch, gpu1.*.merlin7.psi.ch]
          use_overlays: [PSI, Alps]
          group_deps:
            compiler: { gcc: [14.3.0] }
            mpi: { openmpi: [5.0.10] }
        - group: MPI
          overlay: Alps
          relstage: unstable
          target_cpus: [aarch64]
          systems: [gpu0.*.merlin7.psi.ch]
          use_overlays: [PSI, Alps]
          group_deps:
            compiler: { gcc: [14.3.0] }
            mpi: { openmpi: [5.0.10] }

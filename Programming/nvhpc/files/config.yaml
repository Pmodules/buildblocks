---
# yamllint disable rule:line-length
format: 1
nvhpc:
  defaults:
    group: Programming
    overlay: base
    relstage: stable
    systems: ['*.merlin7.*', 'merlin-*', 'ra-*']
    docfiles: [AUTHORS, LICENSE, NEWS, README]
    compile_in_sourcetree: true
  shasums:
    nvhpc-24.3.tar.gz: 4fb8949ba8cef73b28818bd9375c9420ec48fab1c64e71315a7c1984f5329d6b
    nvhpc-23.5.tar.gz: 3196309b38df6f0a27e18b80f6a40e23cab8195cad43fc6bbd569af7d8ca5742
    nvhpc_2026_265_Linux_aarch64_cuda_multi.tar.gz: 470e0deed377286ecb7a9b6d213d6750834c648091e1d11f702a5c1b733687da
    nvhpc_2026_265_Linux_x86_64_cuda_multi.tar.gz: 2d96e4037ff8aa9fc31a3e237b95890a954e69aa99836e38687256307b876718

  versions:
    26.5:
      variants:
        - suffix: _cuda_multi
          target_cpus: [x86_64]
          systems: [.*.merlin7.psi.ch]
          urls:
            - url: https://developer.download.nvidia.com/hpc-sdk/${V_PKG}/nvhpc_2026_265_Linux_x86_64_cuda_multi.tar.gz
          relstage: stable
          build_requires:
            - gcc/14.3.0
        - suffix: _cuda_multi
          target_cpus: [aarch64]
          systems: [gpu0.*.merlin7.psi.ch]
          urls:
            - url: https://developer.download.nvidia.com/hpc-sdk/${V_PKG}/nvhpc_2026_265_Linux_aarch64_cuda_multi.tar.gz
          relstage: stable
          build_requires:
            - gcc/14.3.0
    24.3:
      variants:
        - suffix: _cuda_12.3
          urls:
            - url: https://developer.download.nvidia.com/hpc-sdk/${V_PKG}/nvhpc_2024_243_Linux_x86_64_cuda_12.3.tar.gz
          relstage: stable
          build_requires: [gcc/10.4.0]
    23.5:
      variants:
        - suffix: _cuda_12.1
          urls:
            - url: https://developer.download.nvidia.com/hpc-sdk/${V_PKG}/nvhpc_2023_235_Linux_x86_64_cuda_12.1.tar.gz

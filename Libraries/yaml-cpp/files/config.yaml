---
# yamllint disable rule:line-length
format: 1
yaml-cpp:
  defaults:
    group: Libraries
    overlay: base
    relstage: unstable
    compile_in_sourcetree: false
    configure_with: cmake
    build_requires: [cmake/4.4.0]
    docfiles: [LICENSE]
    urls:
      - url: https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-${V_PKG}.tar.gz
    configure_args:
      # - -GUnix Makefiles
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DYAML_BUILD_SHARED_LIBS=ON
      - -DYAML_CPP_BUILD_TESTS=OFF
      - -DYAML_CPP_BUILD_TOOLS=OFF

  shasums:
    yaml-cpp-0.9.0.tar.gz: 25cb043240f828a8c51beb830569634bc7ac603978e0f69d6b63558dadefd49a

  versions:
    0.9.0:
      config:

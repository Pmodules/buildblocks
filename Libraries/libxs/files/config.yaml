---
# yamllint disable rule:line-length
format: 1
libxs:
  defaults:
    group: Libraries
    overlay: base
    relstage: stable
    urls:
      - url: https://github.com/hfp/${P}/archive/refs/tags/${V_PKG}.tar.gz

  shasums:
    1.0.0.tar.gz: b26654a9d7d41e7281a785d3674626c2484c92e7fc698e166639c8e78b2b18ee

  versions:
    1.0.0:
      variants:
        - overlay: base
          target_cpus: [x86_64]
          systems: [.*.merlin7.psi.ch]
          relstage: stable
          configure_with: cmake
          build_requires:
            - gcc/13.4.0
          runtime_deps:
            - gcc/13.4.0
        - overlay: base
          target_cpus: [aarch64]
          systems: [gpu0.*.merlin7.psi.ch]
          relstage: stable
          configure_with: cmake
          build_requires:
            - gcc/14.3.0
          runtime_deps:
            - gcc/14.3.0
